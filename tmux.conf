# Dedicated harness-footer server; does not change the user's own tmux setup.
# Options below make the agent CLIs behave as they do outside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"

# Report modified keys such as Shift+Enter instead of collapsing them to
# Enter. "always" is needed because tmux ignores the kitty keyboard query
# that Claude Code uses to request them.
set -s extended-keys always
set -s extended-keys-format csi-u

# Pass through notifications, clipboard writes, focus changes and titles.
set -g allow-passthrough on
set -s set-clipboard on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# No prefix key, so every keystroke (including Claude's Ctrl+B) reaches the
# CLI. The mouse wheel scrolls tmux history, which the terminal cannot see.
set -g prefix None
set -g prefix2 None
unbind C-b
set -g mouse on

set -s escape-time 10
set -g history-limit 50000

set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left " harness-footer: starting…"
set -g status-right ""
set -g status-left-length 100
